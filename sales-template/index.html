<title>Fragrance Launch Sales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a horizontal deck of full-screen slides on a dark stage; glowing glass bars stand on a perspective floor grid. Single dark look by design. */
:root {
  --bg: #05070c;
  --stage: #111a2b;
  --fg: #f3f1ed;
  --dim: #b9bfcb;
  --muted: #7d8697;
  --line: rgba(255, 255, 255, 0.09);
  --soft: rgba(255, 255, 255, 0.035);
  --accent: #ff8a2a;
  --hero: #6aa5e0;
  --good: #5fd39a;
  --bad: #ff6b5e;
  --c1: #ff8a2a; --c2: #6aa5e0; --c3: #ffc58a; --c4: #d0521c; --c5: #a9b8c8; --c6: #9a6436;
  --sans: "Montserrat", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 45% at 50% 108%, rgba(255, 120, 30, 0.22), transparent 70%),
    radial-gradient(ellipse 90% 70% at 50% 0%, var(--stage), var(--bg) 75%);
  background-color: var(--bg);
}
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* stage */
.deck { position: relative; height: 100%; overflow: hidden; isolation: isolate; }
.floor { position: absolute; left: -50%; right: -50%; bottom: 0; height: 34vh; z-index: -1; pointer-events: none;
  background:
    repeating-linear-gradient(90deg, rgba(255, 150, 70, 0.22) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(0deg, rgba(255, 150, 70, 0.12) 0 1px, transparent 1px 48px);
  transform: perspective(260px) rotateX(62deg); transform-origin: 50% 100%;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%); mask-image: linear-gradient(to top, #000 10%, transparent 85%); }
.source { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 110px; z-index: 4; transform: rotate(-90deg); transform-origin: 0 0;
  font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.source b { color: var(--dim); font-weight: 500; }
@media (max-width: 700px) { .source { display: none; } }
.progress { position: absolute; inset: 0 0 auto; height: 1px; background: var(--line); z-index: 5; }
.progress span { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width .5s cubic-bezier(.2,.7,.2,1); }
.track { display: flex; height: 100%; transition: transform .7s cubic-bezier(.65,0,.25,1); }
.track.instant { transition: none; }
.slide {
  flex: 0 0 100%; height: 100%; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
  padding-block: clamp(32px, 7vh, 72px) 108px;
  padding-left: max(28px, env(safe-area-inset-left, 0px), 6vw);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 6vw);
}
.inner { margin: auto 0; width: 100%; max-width: 1160px; align-self: center; display: grid; gap: clamp(20px, 4vh, 40px); min-width: 0; }

/* type */
.tag { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tag i { font-style: normal; color: var(--accent); }
h1, h2 { margin: 0; text-transform: uppercase; font-weight: 700; letter-spacing: 0.01em; line-height: 1.12; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 4.2vw, 3.1rem); }
h2 { font-size: clamp(1.25rem, 2.6vw, 2rem); }
.ruled { display: grid; gap: 14px; justify-items: start; }
.ruled::after { content: ""; height: 1px; width: min(100%, 560px); background: linear-gradient(90deg, var(--accent), rgba(255, 138, 42, 0.15)); order: 2; }
.ruled .cap { order: 3; }
.ruled.center { justify-items: center; text-align: center; }
.ruled.center::after { width: min(100%, 980px); background: linear-gradient(90deg, transparent, var(--accent) 15%, var(--accent) 85%, transparent); }
.cap { margin: 0; font-weight: 200; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); font-size: clamp(0.95rem, 1.8vw, 1.35rem); line-height: 1.35; max-width: 46ch; text-wrap: balance; }
.thin { font-weight: 200; letter-spacing: -0.01em; line-height: 1; font-variant-numeric: tabular-nums; }
.big { font-size: clamp(2.6rem, 6vw, 4.6rem); }
.mid { font-size: clamp(1.7rem, 3vw, 2.4rem); }
.cur { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.12em; color: var(--accent); margin-right: 0.6em; vertical-align: 0.4em; font-weight: 400; }
.big .cur { font-size: 0.8rem; vertical-align: 1.6em; }
.lbl { font-weight: 700; text-transform: uppercase; font-size: 0.82rem; letter-spacing: 0.04em; }
.up { color: var(--good); } .down { color: var(--bad); }
.hint { color: var(--muted); font-size: 0.8rem; font-family: var(--mono); letter-spacing: 0.02em; }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px; }
.head > div:first-child { min-width: 0; }
.two { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(24px, 5vw, 72px); align-items: end; }
.two.rev { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); }
@media (max-width: 860px) { .two, .two.rev { grid-template-columns: minmax(0, 1fr); } }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--soft); border-radius: 2px; padding: 5px 10px; cursor: pointer; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; color: var(--dim); transition: border-color .15s, color .15s, opacity .15s, box-shadow .15s; }
.chip:hover { border-color: rgba(255, 255, 255, 0.3); color: var(--fg); }
.chip.year[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px rgba(255, 138, 42, 0.25), inset 0 0 10px rgba(255, 138, 42, 0.12); }
.dot { display: inline-block; width: 7px; height: 7px; flex: none; box-shadow: 0 0 8px currentColor; }
.chip.sec[aria-pressed="false"] { opacity: 0.35; }
.chip.sec[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1px var(--muted); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 clamp(20px, 3vw, 40px); }
.stat { position: relative; border-top: 1px solid var(--line); padding-top: 18px; padding-bottom: 26px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.stat::before { content: ""; position: absolute; top: -1px; left: 0; width: 36px; height: 1px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.stat .note { color: var(--muted); font-size: 0.8rem; font-family: var(--mono); }
.stat .mid { overflow-wrap: anywhere; }
.stat .name { font-size: clamp(1.15rem, 2vw, 1.5rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.15; overflow-wrap: anywhere; }

/* charts */
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; }
svg .grid { stroke: rgba(255, 255, 255, 0.06); stroke-dasharray: 2 4; }
svg .base { stroke: rgba(255, 255, 255, 0.18); }
svg .bar { transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .25s; }
svg .col.dim .bar, svg .col.dim .refl { opacity: 0.28; }
svg .v { fill: var(--fg); font-family: var(--sans); font-weight: 200; font-size: 22px; letter-spacing: 0; }
svg .n { fill: var(--fg); font-family: var(--sans); font-weight: 700; font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; }
svg .col.dim .v, svg .col.dim .n { fill: var(--muted); }
svg .yl { font-size: 11px; }
svg .col.sel .yl { fill: var(--accent); }
svg .hit { fill: transparent; cursor: pointer; }
.slide.enter .bar { animation: grow .9s cubic-bezier(.2,.7,.2,1) both; }
.slide.enter .refl { animation: fade 1.2s ease both; }
.slide.enter .bar-h > span { animation: growx .9s cubic-bezier(.2,.7,.2,1) both; }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes growx { from { transform: scaleX(0); } }
@keyframes fade { from { opacity: 0; } }

/* lists */
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) auto; gap: 20px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--line); }
.row:first-child { border-top: 1px solid var(--line); }
.row .name { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.row .name > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .name small { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; font-weight: 400; }
.row .val { text-align: right; display: grid; justify-items: end; }
.row .val small { color: var(--muted); font-size: 0.75rem; font-family: var(--mono); }
.row.off { opacity: 0.3; }
.bar-h { height: 4px; display: flex; gap: 3px; }
.bar-h > span { height: 100%; transform-origin: left; box-shadow: 0 0 12px currentColor, 0 0 2px currentColor; }
.share { font-size: clamp(1.5rem, 2.8vw, 2.1rem); font-weight: 200; }
@media (max-width: 600px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .bar-h { grid-column: 1 / -1; grid-row: 2; } }

.panel { display: grid; gap: 18px; align-content: start; min-width: 0; }
.kv { display: grid; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding-block: 9px; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
.kv > div > span:first-child { display: inline-flex; align-items: center; gap: 10px; color: var(--dim); }
.kv > div > span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.new { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em; color: var(--accent); border: 1px solid rgba(255, 138, 42, 0.5); padding: 0 6px; }

/* table */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; font-family: var(--mono); }
th, td { padding: 11px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; padding-left: 0; font-family: var(--sans); }
td:first-child { font-weight: 500; }
thead th { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); font-weight: 400; cursor: pointer; user-select: none; font-family: var(--mono) !important; }
thead th[aria-sort] { color: var(--accent); }
tr.main { cursor: pointer; }
tr.main:hover td { background: var(--soft); }
tr.detail td { color: var(--muted); font-size: 0.78rem; }
tr.detail td:first-child { padding-left: 22px; font-weight: 400; }
td.pre { color: rgba(255, 255, 255, 0.15); }
tfoot td { border-top: 1px solid var(--accent); border-bottom: 0; color: var(--fg); font-weight: 500; }
.caret { display: inline-block; width: 16px; color: var(--accent); transition: transform .15s; }
tr.open .caret { transform: rotate(90deg); }

/* data */
textarea { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 2px; padding: 14px; background: rgba(0, 0, 0, 0.35); font-family: var(--mono); font-size: 0.78rem; resize: vertical; color: var(--dim); }
pre.format { margin: 0; padding: 14px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); font-family: var(--mono); font-size: 0.75rem; overflow-x: auto; color: var(--dim); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--soft); padding: 8px 14px; border-radius: 2px; cursor: pointer; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; }
.btn:hover { border-color: rgba(255, 255, 255, 0.35); }
.btn.primary { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 16px rgba(255, 138, 42, 0.25); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
select { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 2px; padding: 6px 10px; font-family: var(--mono); font-size: 0.78rem; }
.status { font-size: 0.8rem; font-family: var(--mono); }
.status.err { color: var(--bad); } .status.ok { color: var(--good); }

/* nav */
.nav {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-top: 14px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(28px, env(safe-area-inset-left, 0px), 6vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 6vw);
}
.nav .where { display: flex; gap: 14px; align-items: baseline; min-width: 0; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
.nav .where b { font-weight: 400; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .where span { color: var(--accent); }
.nav .ctrl { display: flex; gap: 6px; align-items: center; position: relative; }
.icon { width: 38px; height: 38px; border-radius: 2px; border: 1px solid var(--line); background: rgba(5, 7, 12, 0.6); cursor: pointer; display: grid; place-items: center; font-family: var(--mono); font-size: 0.9rem; backdrop-filter: blur(6px); }
.icon:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.icon:disabled { opacity: 0.25; cursor: default; }
.menu { position: absolute; right: 0; bottom: 48px; background: rgba(8, 11, 18, 0.96); border: 1px solid var(--line); padding: 6px; min-width: 240px; max-height: 60vh; overflow-y: auto; box-shadow: 0 16px 40px rgb(0 0 0 / 0.5); }
.menu button { display: flex; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; padding: 8px 10px; cursor: pointer; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; }
.menu button:hover, .menu button[aria-current="true"] { background: var(--soft); color: var(--accent); }
.menu button span { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; width: 20px; font-weight: 400; }

.tip { position: fixed; pointer-events: none; background: rgba(8, 11, 18, 0.95); border: 1px solid rgba(255, 138, 42, 0.45); color: var(--fg); padding: 8px 10px; font-family: var(--mono); font-size: 0.72rem; line-height: 1.6; z-index: 20; max-width: 250px; box-shadow: 0 0 18px rgba(255, 138, 42, 0.15); }
.tip b { font-weight: 500; display: block; margin-bottom: 2px; color: var(--accent); }
.tip div { display: flex; justify-content: space-between; gap: 14px; color: var(--dim); }
.empty { color: var(--muted); padding: 24px 0; }
@media (prefers-reduced-motion: reduce) { .track, .progress span { transition: none; } .slide.enter .bar, .slide.enter .refl, .slide.enter .bar-h > span { animation: none; } }
</style>

<main class="deck" id="deck">
  <div class="floor" aria-hidden="true"></div>
  <div class="progress"><span id="prog"></span></div>
  <div class="track" id="track"></div>
  <div class="source" id="source"></div>
  <nav class="nav" aria-label="Slides">
    <div class="where"><span id="count"></span><b id="where"></b></div>
    <div class="ctrl">
      <button class="icon" id="menuBtn" type="button" aria-label="All slides" aria-expanded="false">≡</button>
      <button class="icon" id="prevBtn" type="button" aria-label="Previous slide">←</button>
      <button class="icon" id="nextBtn" type="button" aria-label="Next slide">→</button>
      <div class="menu" id="menu" hidden></div>
    </div>
  </nav>
</main>
<div class="tip" id="tip" hidden></div>

<script>
/* ------------------------------------------------------------------
   SAMPLE DATA: replace with your real figures, or paste a CSV on the
   last slide ("Your data").
   Each launch: sales[year] = [one value per section, same order as sections]
------------------------------------------------------------------- */
const SAMPLE = {
  currency: "AED",
  sections: ["Retail stores", "Duty free", "E-commerce", "Wholesale"],
  launches: [
    { name: "Amber Nuit",    launched: 2021, sales: {
      2021: [420000, 185000,  96000, 210000],
      2022: [610000, 260000, 158000, 290000],
      2023: [655000, 300000, 214000, 305000],
      2024: [590000, 280000, 248000, 270000],
      2025: [540000, 250000, 265000, 240000] } },
    { name: "Oud Sahara",    launched: 2022, sales: {
      2022: [380000, 340000,  72000, 150000],
      2023: [720000, 520000, 165000, 260000],
      2024: [810000, 610000, 240000, 300000],
      2025: [790000, 640000, 310000, 320000] } },
    { name: "Rose Marine",   launched: 2023, sales: {
      2023: [210000,  90000, 140000,  80000],
      2024: [330000, 120000, 260000, 110000],
      2025: [360000, 135000, 330000, 125000] } },
    { name: "Velvet Musk",   launched: 2024, sales: {
      2024: [290000, 160000, 190000, 120000],
      2025: [480000, 240000, 350000, 170000] } },
    { name: "Citrus Majlis", launched: 2025, sales: {
      2025: [260000, 210000, 180000,  95000] } }
  ]
};

const STORE_KEY = "fragrance-sales-data-v1";
const $ = id => document.getElementById(id);
const color = i => typeof i === "number" ? `var(--c${(i % 6) + 1})` : i;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function loadSaved() { try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch { return null; } }
function save(d) { try { d ? localStorage.setItem(STORE_KEY, JSON.stringify(d)) : localStorage.removeItem(STORE_KEY); } catch {} }

let data = loadSaved() || SAMPLE;
let usingOwn = data !== SAMPLE;
const state = { idx: 0, off: new Set(), ovYear: null, splitYear: "all", rankYear: "all", sort: { key: "total", dir: -1 }, open: new Set(), draft: null, status: null };

/* ---------- maths ---------- */
const years = () => [...new Set(data.launches.flatMap(l => Object.keys(l.sales).map(Number)))].sort((a, b) => a - b);
const secs = () => data.sections.map((_, i) => i).filter(i => !state.off.has(i));
const val = (l, y, i) => { const r = l.sales[y]; return r ? (Number(r[i]) || 0) : 0; };
const inYear = sel => y => sel === "all" || Number(sel) === y;
const launchSec = (l, i, yf = () => true) => Object.keys(l.sales).map(Number).filter(yf).reduce((t, y) => t + val(l, y, i), 0);
const launchTotal = (l, yf = () => true) => secs().reduce((t, i) => t + launchSec(l, i, yf), 0);
const launchYear = (l, y) => secs().reduce((t, i) => t + val(l, y, i), 0);
const yearTotal = y => data.launches.reduce((t, l) => t + launchYear(l, y), 0);
const secTotal = (i, yf = () => true) => data.launches.reduce((t, l) => t + launchSec(l, i, yf), 0);
const grand = () => data.launches.reduce((t, l) => t + launchTotal(l), 0);

function short(n) {
  const a = Math.abs(n), d = x => String(Number(x.toFixed(2)));
  return a >= 1e9 ? d(n / 1e9) + "B" : a >= 1e6 ? d(n / 1e6) + "M" : a >= 1e3 ? Math.round(n / 1e3) + "K" : String(Math.round(n));
}
const fmt = n => `${data.currency} ${short(n)}`;
const full = n => `${data.currency} ${Math.round(n).toLocaleString("en-US")}`;
const money = n => `<span class="cur">${esc(data.currency)}</span>${short(n)}`;
const pct = x => (x * 100).toFixed(1) + "%";
const delta = (cur, prev) => prev ? (cur - prev) / prev : null;
const deltaHTML = d => d == null ? `<span class="hint">first year</span>` : `<span class="num ${d >= 0 ? "up" : "down"}">${d >= 0 ? "▲" : "▼"} ${pct(Math.abs(d))}</span>`;
const two = n => String(n).padStart(2, "0");
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}

/* ---------- shared pieces ---------- */
const tag = (k, label) => `<span class="tag"><i>[${two(k)}]</i> ${label}</span>`;
const legend = () => `<div class="chips" role="group" aria-label="Sections">${data.sections.map((s, i) =>
  `<button class="chip sec" type="button" data-act="sec" data-i="${i}" aria-pressed="${!state.off.has(i)}"><span class="dot" style="background:${color(i)};color:${color(i)}"></span>${esc(s)}</button>`).join("")}</div>`;
const yearChips = (act, sel) => `<div class="chips" role="group" aria-label="Year">${["all", ...years()].map(y =>
  `<button class="chip year" type="button" data-act="${act}" data-y="${y}" aria-pressed="${String(sel) === String(y)}">${y === "all" ? "All" : y}</button>`).join("")}</div>`;

/* Glass bar chart.
   cols = [{ key, label, parts: [[secIndex | cssColor, value]], top?: [valueText, nameText] }]
   Segments are translucent glass with lit edges; a glowing cap sits on top and a fading reflection below the floor line. */
let uid = 0;
function glass(cols, { sel = null, H = 340, act = null, axis = true } = {}) {
  const id = "g" + (++uid);
  const W = 720, labelRoom = cols.some(c => c.top) ? 74 : 26;
  const m = { t: labelRoom, r: 8, b: axis ? 52 : 34, l: axis ? 46 : 8 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const sums = cols.map(c => c.parts.reduce((t, p) => t + p[1], 0));
  const max = niceMax(Math.max(0, ...sums));
  const y = v => m.t + ih - (v / max) * ih;
  const base = m.t + ih;
  const band = iw / Math.max(cols.length, 1), bw = Math.min(70, band * 0.62);
  const keys = [...new Set(cols.flatMap(c => c.parts.map(p => String(p[0]))))];
  const gid = k => `${id}-${keys.indexOf(String(k))}`;
  let defs = `<filter id="${id}-glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="${id}-pool" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient>`;
  keys.forEach(k => {
    const c = color(isNaN(k) ? k : Number(k));
    defs += `<linearGradient id="${gid(k)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c};stop-opacity:.10"/><stop offset="1" style="stop-color:${c};stop-opacity:.55"/></linearGradient>
      <linearGradient id="${gid(k)}-r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c};stop-opacity:.32"/><stop offset="1" style="stop-color:${c};stop-opacity:0"/></linearGradient>`;
  });
  let g = "";
  if (axis) [0.5, 1].forEach(f => g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${m.l - 8}" y="${y(max * f) + 3}" text-anchor="end">${short(max * f)}</text>`);
  g += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${base}" y2="${base}"/>`;
  cols.forEach((c, k) => {
    const x = m.l + band * k + (band - bw) / 2, cx = x + bw / 2;
    const cls = sel == null ? "" : String(sel) === String(c.key) ? " sel" : " dim";
    let acc = 0, segs = "", topKey = null;
    c.parts.forEach(([i, v]) => {
      if (!v) return;
      const y0 = y(acc), y1 = y(acc + v), col = color(i);
      segs += `<rect x="${x}" y="${y1}" width="${bw}" height="${y0 - y1}" fill="url(#${gid(i)})" stroke="${col}" stroke-opacity=".75" stroke-width="1"/>
        <line x1="${x + 3}" x2="${x + 3}" y1="${y1 + 2}" y2="${y0 - 2}" stroke="${col}" stroke-opacity=".5" stroke-width="1"/>`;
      acc += v; topKey = i;
    });
    const h = base - y(acc), rh = Math.min(h * 0.35, 34);
    const topCol = topKey == null ? "transparent" : color(topKey);
    const bottomKey = c.parts.find(p => p[1])?.[0];
    let el = `<ellipse cx="${cx}" cy="${base + 2}" rx="${bw * 0.95}" ry="10" fill="url(#${id}-pool)" class="refl"/>`;
    if (acc) el += `<g class="bar" style="animation-delay:${k * 80}ms">${segs}<rect x="${x - 1}" y="${y(acc) - 1.5}" width="${bw + 2}" height="3" fill="${topCol}" filter="url(#${id}-glow)"/></g>
      <rect class="refl" x="${x}" y="${base + 3}" width="${bw}" height="${rh}" fill="url(#${gid(bottomKey)}-r)"/>`;
    if (c.top) {
      const words = String(c.top[1]).toUpperCase().split(/\s+/);
      const ty = y(acc) - 14 - (words.length - 1) * 12;
      el += `<text class="v" x="${cx}" y="${ty - 18}" text-anchor="middle">${esc(c.top[0])}</text><text class="n" x="${cx}" y="${ty}" text-anchor="middle">${words.map((w, n) => `<tspan x="${cx}" dy="${n ? 12 : 0}">${esc(w)}</tspan>`).join("")}</text>`;
    } else if (acc) el += `<text class="v" x="${cx}" y="${y(acc) - 12}" text-anchor="middle" style="font-size:16px">${short(acc)}</text>`;
    if (axis) el += `<text class="yl" x="${cx}" y="${base + rh + 16 > H - 4 ? H - 4 : base + 46}" text-anchor="middle">${esc(c.label)}</text>`;
    const tip = [`${c.label} · ${fmt(sums[k])}`, ...c.parts.filter(p => p[1] && typeof p[0] === "number").map(([i, v]) => `${data.sections[i]}~${short(v)}`)].join("|");
    el += `<rect class="hit" x="${m.l + band * k}" y="0" width="${band}" height="${H}" data-tip="${esc(tip)}"${act ? ` data-act="${act}" data-y="${c.key}"` : ""}/>`;
    g += `<g class="col${cls}">${el}</g>`;
  });
  return cols.length ? `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart"><defs>${defs}</defs>${g}</svg>` : `<p class="empty">No data yet.</p>`;
}
const stackBar = parts => {
  const t = parts.reduce((a, p) => a + p[1], 0);
  return parts.filter(p => p[1]).map(([i, v], k) => `<span style="flex:${v / t};background:${color(i)};color:${color(i)};animation-delay:${k * 60}ms"></span>`).join("");
};

/* ---------- slides ---------- */
function cover(k) {
  const ys = years(), g = grand();
  const ranked = [...data.launches].map(l => [l, launchTotal(l)]).sort((a, b) => a[1] - b[1]);
  const cols = ranked.map(([l, v], n) => ({ key: l.name, label: l.name, parts: [[n === ranked.length - 1 ? "var(--hero)" : "var(--accent)", v]], top: [g ? pct(v / g) : "0%", l.name] }));
  return `<div class="inner">
    <div class="ruled center"><h1>Fragrance Launch Sales</h1><p class="cap">Distribution of total sales by perfume launch, ${ys[0] ?? ""}–${ys[ys.length - 1] ?? ""}</p></div>
    <div style="max-width:980px;width:100%;justify-self:center">${glass(cols, { H: 380, axis: false })}</div>
    <div class="head" style="justify-content:center;gap:12px 40px;text-align:center">
      <span class="tag">Total <i>${full(g)}</i></span><span class="tag">${data.launches.length} launches · ${data.sections.length} sections</span><span class="tag">Press <i>→</i> or swipe</span>
    </div></div>`;
}

function glance(k) {
  const ys = years(), last = ys[ys.length - 1], prev = ys[ys.length - 2];
  const cur = yearTotal(last), d = delta(cur, prev != null ? yearTotal(prev) : 0);
  const best = [...data.launches].sort((a, b) => launchTotal(b) - launchTotal(a))[0];
  const top = secs().map(i => [i, secTotal(i)]).sort((a, b) => b[1] - a[1])[0];
  const g = grand(), newest = data.launches.filter(l => l.launched === last);
  return `<div class="inner">
    <div class="ruled">${tag(k, "At a glance")}<h2>The portfolio in four numbers</h2></div>
    <div class="stats">
      <div class="stat"><span class="tag">Total sales</span><span class="thin mid">${money(g)}</span><span class="note">${ys.length} yrs · ${full(g)}</span></div>
      <div class="stat"><span class="tag">${last}</span><span class="thin mid">${money(cur)}</span><span class="note">${deltaHTML(d)} vs ${prev ?? "—"}</span></div>
      <div class="stat"><span class="tag">Best launch</span><span class="name">${best ? esc(best.name) : "—"}</span><span class="note">${best ? `${fmt(launchTotal(best))} · ${pct(launchTotal(best) / (g || 1))}` : ""}</span></div>
      <div class="stat"><span class="tag">Top section</span><span class="name">${top ? esc(data.sections[top[0]]) : "—"}</span><span class="note">${top ? `${pct(top[1] / (g || 1))} of sales · ${newest.length} new in ${last}` : ""}</span></div>
    </div></div>`;
}

function yearSlide(k) {
  const ys = years();
  if (state.ovYear == null || !ys.includes(Number(state.ovYear))) state.ovYear = ys[ys.length - 1];
  const sy = Number(state.ovYear), prev = ys[ys.indexOf(sy) - 1];
  const cur = yearTotal(sy), d = delta(cur, prev != null ? yearTotal(prev) : 0);
  const cols = ys.map(y => ({ key: y, label: String(y), parts: secs().map(i => [i, data.launches.reduce((t, l) => t + val(l, y, i), 0)]) }));
  const contrib = data.launches.map(l => [l, launchYear(l, sy)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  return `<div class="inner">
    <div class="head"><div class="ruled">${tag(k, "Sales per year")}<h2>Growth year by year</h2></div>${legend()}</div>
    <div class="two">
      <div>${glass(cols, { sel: sy, act: "ovYear", H: 360 })}<p class="hint" style="margin:6px 0 0">› Select a year for its breakdown</p></div>
      <div class="panel">
        <div style="display:grid;gap:10px"><span class="tag">FY <i>${sy}</i></span><span class="thin big">${money(cur)}</span><span>${deltaHTML(d)} <span class="hint">vs ${prev ?? "previous year"}</span></span></div>
        <div class="kv">${contrib.map(([l, v]) => `<div><span>${esc(l.name)}${l.launched === sy ? ' <span class="new">NEW</span>' : ""}</span><span>${short(v)}</span></div>`).join("")}</div>
      </div>
    </div></div>`;
}

function sectionSlide(k) {
  const yf = inYear(state.splitYear);
  const rows = data.sections.map((s, i) => [i, secTotal(i, yf)]);
  const total = rows.filter(r => !state.off.has(r[0])).reduce((t, r) => t + r[1], 0);
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="inner">
    <div class="head"><div class="ruled">${tag(k, "Sections")}<h2>Where the sales come from</h2></div>${yearChips("splitYear", state.splitYear)}</div>
    <div class="rows">${rows.sort((a, b) => b[1] - a[1]).map(([i, v]) => {
      const off = state.off.has(i);
      return `<div class="row${off ? " off" : ""}">
        <button class="chip sec" type="button" data-act="sec" data-i="${i}" aria-pressed="${!off}" style="justify-self:start"><span class="dot" style="background:${color(i)};color:${color(i)}"></span>${esc(data.sections[i])}</button>
        <div class="bar-h"><span style="width:${(v / max) * 100}%;background:${color(i)};color:${color(i)}"></span></div>
        <div class="val"><span class="share thin">${off || !total ? "—" : pct(v / total)}</span><small>${fmt(v)}</small></div></div>`;
    }).join("")}</div>
    <p class="hint" style="margin:0">› Toggle a section to remove it from every slide · share is of sections shown</p></div>`;
}

function launchSlide(l, n, k) {
  const ys = years().filter(y => y >= l.launched);
  const tot = launchTotal(l), g = grand();
  const byYear = ys.map(y => [y, launchYear(l, y)]);
  const bestY = [...byYear].sort((a, b) => b[1] - a[1])[0];
  const last = byYear[byYear.length - 1], prev = byYear[byYear.length - 2];
  const top = secs().map(i => [i, launchSec(l, i)]).sort((a, b) => b[1] - a[1]);
  const cols = ys.map(y => ({ key: y, label: String(y), parts: secs().map(i => [i, val(l, y, i)]) }));
  return `<div class="inner">
    <div class="two rev">
      <div class="panel">
        <div class="ruled">${tag(k, `Launch ${two(n + 1)}/${two(data.launches.length)} · est. ${l.launched}`)}<h2 style="font-size:clamp(1.8rem,3.8vw,2.9rem)">${esc(l.name)}</h2></div>
        <div style="display:grid;gap:8px"><span class="tag">Sales to date</span><span class="thin big">${money(tot)}</span></div>
        <div class="kv">
          <div><span>Share of portfolio</span><span>${pct(tot / (g || 1))}</span></div>
          <div><span>Best year</span><span>${bestY ? `${bestY[0]} · ${short(bestY[1])}` : "—"}</span></div>
          <div><span>Latest year</span><span>${last ? `${last[0]} · ${short(last[1])} ` : "—"}${last && prev ? deltaHTML(delta(last[1], prev[1])) : ""}</span></div>
          ${top.map(([i, v]) => `<div><span><span class="dot" style="background:${color(i)};color:${color(i)}"></span>${esc(data.sections[i])}</span><span>${short(v)} · ${pct(v / (tot || 1))}</span></div>`).join("")}
        </div>
      </div>
      <div style="display:grid;gap:16px;min-width:0">${legend()}${glass(cols, { H: 380 })}</div>
    </div></div>`;
}

function rankSlide(k) {
  const yf = inYear(state.rankYear);
  const r = data.launches.map(l => ({ l, t: launchTotal(l, yf), parts: secs().map(i => [i, launchSec(l, i, yf)]) })).sort((a, b) => b.t - a.t);
  const max = Math.max(1, ...r.map(x => x.t)), tot = r.reduce((a, x) => a + x.t, 0);
  return `<div class="inner">
    <div class="head"><div class="ruled">${tag(k, "Ranking")}<h2>Which launches sell most</h2></div>${yearChips("rankYear", state.rankYear)}</div>
    <div class="rows">${r.map((x, n) => `<div class="row">
      <div class="name"><span class="num" style="color:var(--accent);font-size:.75rem">${two(n + 1)}</span><span class="lbl">${esc(x.l.name)} <small>${x.l.launched}</small></span></div>
      <div class="bar-h" style="width:${(x.t / max) * 100}%" data-tip="${esc([`${x.l.name} · ${fmt(x.t)}`, ...x.parts.filter(p => p[1]).map(([i, v]) => `${data.sections[i]}~${short(v)}`)].join("|"))}">${x.t ? stackBar(x.parts) : ""}</div>
      <div class="val"><span class="share thin">${x.t ? pct(x.t / (tot || 1)) : "—"}</span><small>${x.t ? fmt(x.t) : "not on sale"}</small></div></div>`).join("")}</div>
    ${legend()}</div>`;
}

function tableSlide(k) {
  const ys = years();
  const rows = data.launches.map(l => ({ l, by: ys.map(y => launchYear(l, y)), total: launchTotal(l) }));
  const g = rows.reduce((t, r) => t + r.total, 0);
  const { key, dir } = state.sort;
  const pick = r => key === "name" ? r.l.name : key === "launched" ? r.l.launched : key === "total" ? r.total : r.by[ys.indexOf(Number(key))];
  rows.sort((a, b) => (pick(a) > pick(b) ? 1 : pick(a) < pick(b) ? -1 : 0) * dir);
  const th = (key2, label) => { const on = key === String(key2); return `<th data-act="sort" data-k="${key2}"${on ? ` aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""}>${label}${on ? (dir > 0 ? " ↑" : " ↓") : ""}</th>`; };
  let h = `<thead><tr>${th("name", "Perfume")}${th("launched", "Est.")}${ys.map(y => th(y, y)).join("")}${th("total", "Total")}<th>Share</th></tr></thead><tbody>`;
  rows.forEach(r => {
    const open = state.open.has(r.l.name);
    h += `<tr class="main${open ? " open" : ""}" data-act="row" data-name="${esc(r.l.name)}" tabindex="0" aria-expanded="${open}"><td><span class="caret">›</span>${esc(r.l.name)}</td><td>${r.l.launched}</td>
      ${r.by.map((v, j) => ys[j] < r.l.launched ? `<td class="pre">—</td>` : `<td>${short(v)}</td>`).join("")}<td style="color:var(--fg)">${short(r.total)}</td><td style="color:var(--accent)">${pct(r.total / (g || 1))}</td></tr>`;
    if (open) secs().forEach(i => {
      const v = ys.map(y => val(r.l, y, i));
      h += `<tr class="detail"><td><span class="dot" style="background:${color(i)};color:${color(i)};margin-right:10px"></span>${esc(data.sections[i])}</td><td></td>${v.map((x, j) => `<td>${ys[j] < r.l.launched ? "—" : short(x)}</td>`).join("")}<td>${short(v.reduce((a, b) => a + b, 0))}</td><td></td></tr>`;
    });
  });
  h += `</tbody><tfoot><tr><td>All launches</td><td></td>${ys.map(y => `<td>${short(yearTotal(y))}</td>`).join("")}<td>${short(g)}</td><td>100%</td></tr></tfoot>`;
  return `<div class="inner">
    <div class="head"><div class="ruled">${tag(k, `All figures · ${esc(data.currency)}`)}<h2>Launch by year</h2></div><span class="hint">› Row: section split · header: sort</span></div>
    <div class="table-wrap"><table>${h}</table></div></div>`;
}

function dataSlide(k) {
  if (state.draft == null) state.draft = toCSV(data);
  const st = state.status;
  return `<div class="inner">
    <div class="ruled">${tag(k, "Your data")}<h2>Bring your own numbers</h2><p class="cap" style="font-size:clamp(.85rem,1.4vw,1.05rem)">Paste rows from Excel or a CSV, or upload a file. The deck rebuilds from them. Data stays in this browser.</p></div>
    <div class="two" style="align-items:start">
      <div style="display:grid;gap:12px;min-width:0">
        <label class="tag" for="csvIn">Input · sales rows</label>
        <textarea id="csvIn" spellcheck="false">${esc(state.draft)}</textarea>
        <div class="btns">
          <button class="btn primary" type="button" data-act="apply">Apply data</button>
          <span class="btn file-btn">Upload .csv<input type="file" id="fileIn" accept=".csv,.txt,text/csv" aria-label="Upload CSV file"></span>

          <button class="btn" type="button" data-act="copy">Copy CSV</button>

      </div>
      <div class="panel">
        <span class="tag">Schema · one row per perfume / year / section</span>
        <pre class="format">perfume,launch_year,year,section,sales
Amber Nuit,2021,2021,Retail stores,420000
Amber Nuit,2021,2021,Duty free,185000
Amber Nuit,2021,2022,Retail stores,610000</pre>
        <label style="display:flex;gap:10px;align-items:center"><span class="tag">Currency</span>
          <select id="curSel">${["AED", "USD", "SAR", "EUR", "GBP", "INR"].map(c => `<option${c === data.currency ? " selected" : ""}>${c}</option>`).join("")}</select></label>
        <p class="hint" style="margin:0">Sections and years are read from your rows (max 6 sections). Sales may be revenue or units.</p>

}

const deck = () => [
  { title: "Cover", render: cover },
  { title: "At a glance", render: glance },
  { title: "Sales per year", render: yearSlide },
  { title: "Sections", render: sectionSlide },
  ...data.launches.map((l, n) => ({ title: l.name, render: k => launchSlide(l, n, k) })),
  { title: "Ranking", render: rankSlide },
  { title: "All figures", render: tableSlide },
  { title: "Your data", render: dataSlide }
];

/* ---------- render & navigation ---------- */
const track = $("track");
let list = [];
function render() {
  const scroll = [...track.children].map(s => s.scrollTop);
  list = deck();
  state.idx = Math.min(state.idx, list.length - 1);
  track.classList.add("instant");
  track.innerHTML = list.map((s, k) => `<section class="slide" aria-roledescription="slide" aria-label="${esc(s.title)}">${s.render(k + 1)}</section>`).join("");
  [...track.children].forEach((s, k) => { s.scrollTop = scroll[k] || 0; });
  $("source").innerHTML = `Source: <b>${usingOwn ? "your data" : "sample figures"}</b>`;
  place();
  track.offsetWidth;
  track.classList.remove("instant");
}
function place() {
  track.style.transform = `translateX(${-state.idx * 100}%)`;
  [...track.children].forEach((s, k) => s.inert = k !== state.idx);
  $("prog").style.width = `${((state.idx + 1) / list.length) * 100}%`;
  $("count").textContent = `${two(state.idx + 1)}/${two(list.length)}`;
  $("where").textContent = list[state.idx].title;
  $("prevBtn").disabled = state.idx === 0;
  $("nextBtn").disabled = state.idx === list.length - 1;
  $("menu").innerHTML = list.map((s, k) => `<button type="button" data-go="${k}" aria-current="${k === state.idx}"><span>${two(k + 1)}</span>${esc(s.title)}</button>`).join("");
}
function go(i) {
  i = Math.max(0, Math.min(list.length - 1, i));
  if (i === state.idx) return;
  state.idx = i; place();
  const s = track.children[i];
  s.classList.remove("enter"); s.offsetWidth; s.classList.add("enter");
  setTimeout(() => s.classList.remove("enter"), 1600);
  try { localStorage.setItem(STORE_KEY + "-slide", i); } catch {}
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length) throw new Error("Paste at least one row of data.");
  const delim = lines[0].includes("\t") ? "\t" : lines[0].includes(";") && !lines[0].includes(",") ? ";" : ",";
  const split = line => { const out = []; let cur = "", q = false; for (const ch of line) { if (ch === '"') q = !q; else if (ch === delim && !q) { out.push(cur.trim()); cur = ""; } else cur += ch; } out.push(cur.trim()); return out; };
  let rows = lines.map(split);
  let idx = { perfume: 0, launch_year: 1, year: 2, section: 3, sales: 4 };
  const head = rows[0].map(h => h.toLowerCase().replace(/[^a-z]/g, ""));
  if (head.some(h => ["perfume", "year", "sales", "section"].includes(h))) {
    const find = (...n) => head.findIndex(h => n.includes(h));
    idx = { perfume: find("perfume", "fragrance", "product", "name"), launch_year: find("launchyear", "launched", "launch"), year: find("year", "salesyear"), section: find("section", "channel", "region"), sales: find("sales", "revenue", "amount", "value", "units") };
    rows = rows.slice(1);
    for (const [k, v] of Object.entries(idx)) if (v < 0 && k !== "launch_year") throw new Error(`Couldn't find a "${k}" column in the header row.`);
  }
  const sections = [], map = new Map();
  rows.forEach((r, n) => {
    const name = r[idx.perfume], yr = parseInt(r[idx.year], 10), sec = r[idx.section], ly = parseInt(r[idx.launch_year], 10);
    const sales = parseFloat(String(r[idx.sales] ?? "").replace(/[^0-9.\-]/g, ""));
    if (!name || !sec || isNaN(yr) || isNaN(sales)) throw new Error(`Row ${n + 1} is incomplete: "${r.join(delim)}"`);
    if (!sections.includes(sec)) sections.push(sec);
    if (!map.has(name)) map.set(name, { name, launched: ly || yr, sales: {} });
    const l = map.get(name);
    if (!ly) l.launched = Math.min(l.launched, yr);
    const si = sections.indexOf(sec);
    (l.sales[yr] ||= [])[si] = (l.sales[yr][si] || 0) + sales;
  });
  if (sections.length > 6) throw new Error(`Found ${sections.length} sections; the deck shows up to 6. Merge some and try again.`);
  const launches = [...map.values()];
  launches.forEach(l => Object.values(l.sales).forEach(a => { for (let i = 0; i < sections.length; i++) a[i] = a[i] || 0; }));
  return { currency: data.currency, sections, launches: launches.sort((a, b) => a.launched - b.launched || a.name.localeCompare(b.name)) };
}
function toCSV(d) {
  const out = ["perfume,launch_year,year,section,sales"];
  d.launches.forEach(l => Object.keys(l.sales).sort().forEach(y => d.sections.forEach((s, i) =>
    out.push([l.name, l.launched, y, s, l.sales[y][i] || 0].map(v => /[,"]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v).join(",")))));
  return out.join("\n");
}
function resetView() { state.off.clear(); state.open.clear(); state.ovYear = null; state.splitYear = "all"; state.rankYear = "all"; }
function applyText(text) {
  try {
    data = parseCSV(text); usingOwn = true; save(data); resetView();
    state.status = { msg: `Loaded ${data.launches.length} launches across ${data.sections.length} sections.`, kind: "ok" };
  } catch (e) { state.status = { msg: e.message, kind: "err" }; }
  render();
}

/* ---------- events ---------- */
track.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "sec") { const i = +a.dataset.i; state.off.has(i) ? state.off.delete(i) : state.off.add(i); if (state.off.size === data.sections.length) state.off.delete(i); }
  else if (act === "ovYear") state.ovYear = a.dataset.y;
  else if (act === "splitYear") state.splitYear = a.dataset.y;
  else if (act === "rankYear") state.rankYear = a.dataset.y;
  else if (act === "sort") { const k = a.dataset.k; state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (k === "name" || k === "launched" ? 1 : -1) }; }
  else if (act === "row") { const n = a.dataset.name; state.open.has(n) ? state.open.delete(n) : state.open.add(n); }
  else if (act === "apply") return applyText(state.draft);
  else if (act === "reset") { data = SAMPLE; usingOwn = false; save(null); resetView(); state.draft = toCSV(data); state.status = { msg: "Showing sample figures.", kind: "" }; }
  else if (act === "copy") {
    const csv = toCSV(data);
    const fallback = () => { state.draft = csv; state.status = { msg: "Copy is blocked here. The CSV is in the box; select it and copy.", kind: "" }; render(); };
    if (navigator.clipboard) navigator.clipboard.writeText(csv).then(() => { state.status = { msg: "Copied current data as CSV.", kind: "ok" }; render(); }, fallback); else fallback();
    return;
  }
  tip.hidden = true;
  render();
});
track.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.main")) { e.preventDefault(); e.target.click(); } });
track.addEventListener("input", e => { if (e.target.id === "csvIn") state.draft = e.target.value; });
track.addEventListener("change", e => {
  if (e.target.id === "curSel") { data = { ...data, currency: e.target.value }; if (usingOwn) save(data); else SAMPLE.currency = e.target.value; render(); }
  if (e.target.id === "fileIn") {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { state.draft = rd.result; applyText(rd.result); };
    rd.readAsText(f);
  }
});

$("prevBtn").addEventListener("click", () => go(state.idx - 1));
$("nextBtn").addEventListener("click", () => go(state.idx + 1));
const menu = $("menu");
$("menuBtn").addEventListener("click", () => { menu.hidden = !menu.hidden; $("menuBtn").setAttribute("aria-expanded", !menu.hidden); });
menu.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (!b) return; go(+b.dataset.go); menu.hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); });
document.addEventListener("click", e => { if (!menu.hidden && !e.target.closest(".ctrl")) { menu.hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); } });

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && !e.target.closest("button, tr"))) { e.preventDefault(); go(state.idx + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(state.idx - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(list.length - 1);
  else if (e.key === "Escape") menu.hidden = true;
});
let touch = null;
$("deck").addEventListener("touchstart", e => { touch = e.target.closest(".table-wrap, textarea") ? null : [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
$("deck").addEventListener("touchend", e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch[0], dy = e.changedTouches[0].clientY - touch[1];
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(state.idx + (dx < 0 ? 1 : -1));
  touch = null;
}, { passive: true });

/* tooltip: "Header|Label~value|..." */
const tip = $("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  const [head, ...rest] = t.dataset.tip.split("|");
  tip.innerHTML = `<b>${esc(head)}</b>` + rest.map(r => { const [a, b] = r.split("~"); return `<div><span>${esc(a)}</span><span>${esc(b)}</span></div>`; }).join("");
  tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px";
});

render();
try { const s = +localStorage.getItem(STORE_KEY + "-slide"); if (s > 0) { state.idx = Math.min(s, list.length - 1); place(); } } catch {}
</script>
