<title>Fragrance Launch Sales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a horizontal deck of full-screen slides; one idea per slide, generous whitespace, hairline rules, one warm accent. */
:root {
  --bg: #f7f7f5;
  --fg: #141414;
  --muted: #85857f;
  --line: #e3e2dd;
  --soft: #eeede8;
  --accent: #b4561f;
  --good: #2f7a4c;
  --bad: #b23a3a;
  --c1: #141414; --c2: #b4561f; --c3: #a3a39c; --c4: #dcc9ae; --c5: #56695a; --c6: #cfcec8;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --fg: #efeee9; --muted: #8d8c86; --line: #2a2a27; --soft: #1b1b19; --accent: #e08a4f;
    --good: #6cc391; --bad: #ec7d7d;
    --c1: #efeee9; --c2: #e08a4f; --c3: #7c7b76; --c4: #7a6448; --c5: #8fa892; --c6: #42423e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --fg: #efeee9; --muted: #8d8c86; --line: #2a2a27; --soft: #1b1b19; --accent: #e08a4f;
  --good: #6cc391; --bad: #ec7d7d;
  --c1: #efeee9; --c2: #e08a4f; --c3: #7c7b76; --c4: #7a6448; --c5: #8fa892; --c6: #42423e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* deck */
.deck { position: relative; height: 100%; overflow: hidden; }
.progress { position: absolute; inset: 0 0 auto; height: 2px; background: var(--line); z-index: 5; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .5s cubic-bezier(.2,.7,.2,1); }
.track { display: flex; height: 100%; transition: transform .6s cubic-bezier(.65,0,.25,1); }
.track.instant { transition: none; }
.slide {
  flex: 0 0 100%; height: 100%; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
  padding-block: clamp(32px, 7vh, 80px) 104px;
  padding-left: max(16px, env(safe-area-inset-left, 0px), 6vw);
  padding-right: max(16px, env(safe-area-inset-right, 0px), 6vw);
}
.inner { margin: auto 0; width: 100%; max-width: 1160px; align-self: center; display: grid; gap: clamp(20px, 4vh, 40px); min-width: 0; }

/* type */
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); font-weight: 500; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
h1 { font-size: clamp(2.6rem, 7.5vw, 6rem); line-height: 0.98; letter-spacing: -0.035em; font-weight: 300; }
h2 { font-size: clamp(1.7rem, 3.4vw, 2.6rem); line-height: 1.1; letter-spacing: -0.02em; }
.lead { color: var(--muted); max-width: 52ch; margin: 0; font-size: 1.05rem; }
.big { font-size: clamp(2.4rem, 5.6vw, 4.4rem); font-weight: 300; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.big .cur, .mid .cur { font-size: 0.42em; letter-spacing: 0.04em; color: var(--muted); margin-right: 0.25em; vertical-align: 0.6em; font-weight: 400; }
.mid { font-size: clamp(1.6rem, 3vw, 2.3rem); font-weight: 300; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--bad); }
.hint { color: var(--muted); font-size: 0.85rem; }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px; }
.head > div:first-child { display: grid; gap: 8px; min-width: 0; }
.two { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(24px, 5vw, 72px); align-items: center; }
.two.rev { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); }
@media (max-width: 860px) { .two, .two.rev { grid-template-columns: minmax(0, 1fr); } }

/* chips & legend */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 0.84rem; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, opacity .15s, border-color .15s; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"].year { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip.sec[aria-pressed="false"] { opacity: 0.4; }
.chip.sec[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }

/* cover */
.cover { gap: clamp(28px, 6vh, 64px); }
.cover-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; border-top: 1px solid var(--line); padding-top: 24px; }
.pill { display: inline-flex; width: fit-content; font-size: 0.78rem; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.pill.own { color: var(--good); }
.kbd { font-family: var(--mono); font-size: 0.78rem; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 clamp(20px, 3vw, 40px); }
.stat { border-top: 1px solid var(--fg); padding-top: 16px; padding-bottom: 24px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.stat .note { color: var(--muted); font-size: 0.88rem; }
.stat .mid { overflow-wrap: anywhere; }

/* charts */
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
svg .grid { stroke: var(--line); }
svg .seg { stroke: var(--bg); stroke-width: 1.5; transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .2s; }
svg .col.dim .seg { opacity: 0.25; }
svg .tot { fill: var(--fg); font-size: 12px; }
svg .col.dim .tot { fill: var(--muted); }
svg .hit { fill: transparent; cursor: pointer; }
svg .yl { font-size: 12px; }
svg .col.sel .yl { fill: var(--fg); font-weight: 500; }
.slide.enter .seg { animation: grow .8s cubic-bezier(.2,.7,.2,1) both; }
.slide.enter .bar-h > span { animation: growx .8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes growx { from { transform: scaleX(0); } }

/* lists */
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) auto; gap: 20px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--line); }
.row:first-child { border-top: 1px solid var(--line); }
.row .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .name small { color: var(--muted); }
.row .val { text-align: right; display: grid; justify-items: end; }
.row .val small { color: var(--muted); font-size: 0.8rem; }
.row.off { opacity: 0.35; }
.bar-h { height: 6px; display: flex; gap: 2px; }
.bar-h > span { height: 100%; transform-origin: left; border-radius: 1px; }
.share { font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 300; letter-spacing: -0.02em; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
@media (max-width: 600px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .bar-h { grid-column: 1 / -1; grid-row: 2; } }

.panel { display: grid; gap: 18px; align-content: start; min-width: 0; }
.kv { display: grid; gap: 0; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding-block: 9px; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
.kv > div span:first-child { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }

/* table */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
thead th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; }
thead th[aria-sort] { color: var(--fg); }
tr.main { cursor: pointer; }
tr.main:hover td { background: var(--soft); }
tr.detail td { color: var(--muted); font-size: 0.82rem; }
tr.detail td:first-child { padding-left: 22px; }
td.pre { color: var(--line); }
tfoot td { border-top: 1px solid var(--fg); border-bottom: 0; font-weight: 500; }
.caret { display: inline-block; width: 16px; color: var(--muted); transition: transform .15s; }
tr.open .caret { transform: rotate(90deg); }

/* data */
textarea { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--soft); font-family: var(--mono); font-size: 0.8rem; resize: vertical; }
pre.format { margin: 0; padding: 14px; border-radius: 8px; background: var(--soft); font-family: var(--mono); font-size: 0.78rem; overflow-x: auto; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 0.88rem; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
select { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
.status { font-size: 0.85rem; }
.status.err { color: var(--bad); } .status.ok { color: var(--good); }

/* nav */
.nav {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-top: 14px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px), 6vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 6vw);
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}
.nav .where { display: flex; gap: 12px; align-items: baseline; min-width: 0; font-size: 0.85rem; }
.nav .where b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .where span { color: var(--muted); }
.nav .ctrl { display: flex; gap: 6px; align-items: center; position: relative; }
.icon { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); cursor: pointer; display: grid; place-items: center; font-size: 1rem; }
.icon:hover:not(:disabled) { border-color: var(--fg); }
.icon:disabled { opacity: 0.3; cursor: default; }
.menu { position: absolute; right: 0; bottom: 48px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-width: 230px; max-height: 60vh; overflow-y: auto; box-shadow: 0 12px 32px rgb(0 0 0 / 0.12); }
.menu button { display: flex; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; }
.menu button:hover, .menu button[aria-current="true"] { background: var(--soft); }
.menu button span { color: var(--muted); font-family: var(--mono); font-size: 0.78rem; width: 20px; }

.tip { position: fixed; pointer-events: none; background: var(--fg); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 0.78rem; line-height: 1.5; z-index: 20; max-width: 240px; }
.tip b { font-weight: 500; display: block; margin-bottom: 2px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; }
.empty { color: var(--muted); padding: 24px 0; }
@media (prefers-reduced-motion: reduce) { .track, .progress span { transition: none; } .slide.enter .seg, .slide.enter .bar-h > span { animation: none; } }
</style>

<main class="deck" id="deck">
  <div class="progress"><span id="prog"></span></div>
  <div class="track" id="track"></div>
  <nav class="nav" aria-label="Slides">
    <div class="where"><span class="num" id="count"></span><b id="where"></b></div>
    <div class="ctrl">
      <button class="icon" id="menuBtn" type="button" aria-label="All slides" aria-expanded="false">≡</button>
      <button class="icon" id="prevBtn" type="button" aria-label="Previous slide">←</button>
      <button class="icon" id="nextBtn" type="button" aria-label="Next slide">→</button>
      <div class="menu" id="menu" hidden></div>
    </div>
  </nav>
</main>
<div class="tip" id="tip" hidden></div>

<script>
/* ------------------------------------------------------------------
   SAMPLE DATA: replace with your real figures, or paste a CSV on the
   last slide ("Your data").
   Each launch: sales[year] = [one value per section, same order as sections]
------------------------------------------------------------------- */
const SAMPLE = {
  currency: "AED",
  sections: ["Retail stores", "Duty free", "E-commerce", "Wholesale"],
  launches: [
    { name: "Amber Nuit",    launched: 2021, sales: {
      2021: [420000, 185000,  96000, 210000],
      2022: [610000, 260000, 158000, 290000],
      2023: [655000, 300000, 214000, 305000],
      2024: [590000, 280000, 248000, 270000],
      2025: [540000, 250000, 265000, 240000] } },
    { name: "Oud Sahara",    launched: 2022, sales: {
      2022: [380000, 340000,  72000, 150000],
      2023: [720000, 520000, 165000, 260000],
      2024: [810000, 610000, 240000, 300000],
      2025: [790000, 640000, 310000, 320000] } },
    { name: "Rose Marine",   launched: 2023, sales: {
      2023: [210000,  90000, 140000,  80000],
      2024: [330000, 120000, 260000, 110000],
      2025: [360000, 135000, 330000, 125000] } },
    { name: "Velvet Musk",   launched: 2024, sales: {
      2024: [290000, 160000, 190000, 120000],
      2025: [480000, 240000, 350000, 170000] } },
    { name: "Citrus Majlis", launched: 2025, sales: {
      2025: [260000, 210000, 180000,  95000] } }
  ]
};

const STORE_KEY = "fragrance-sales-data-v1";
const $ = id => document.getElementById(id);
const color = i => `var(--c${(i % 6) + 1})`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function loadSaved() { try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch { return null; } }
function save(d) { try { d ? localStorage.setItem(STORE_KEY, JSON.stringify(d)) : localStorage.removeItem(STORE_KEY); } catch {} }

let data = loadSaved() || SAMPLE;
let usingOwn = data !== SAMPLE;
const state = { idx: 0, off: new Set(), ovYear: null, splitYear: "all", rankYear: "all", sort: { key: "total", dir: -1 }, open: new Set(), draft: null, status: null };

/* ---------- maths ---------- */
const years = () => [...new Set(data.launches.flatMap(l => Object.keys(l.sales).map(Number)))].sort((a, b) => a - b);
const secs = () => data.sections.map((_, i) => i).filter(i => !state.off.has(i));
const val = (l, y, i) => { const r = l.sales[y]; return r ? (Number(r[i]) || 0) : 0; };
const inYear = sel => y => sel === "all" || Number(sel) === y;
const launchSec = (l, i, yf = () => true) => Object.keys(l.sales).map(Number).filter(yf).reduce((t, y) => t + val(l, y, i), 0);
const launchTotal = (l, yf = () => true) => secs().reduce((t, i) => t + launchSec(l, i, yf), 0);
const launchYear = (l, y) => secs().reduce((t, i) => t + val(l, y, i), 0);
const yearTotal = y => data.launches.reduce((t, l) => t + launchYear(l, y), 0);
const secTotal = (i, yf = () => true) => data.launches.reduce((t, l) => t + launchSec(l, i, yf), 0);
const grand = () => data.launches.reduce((t, l) => t + launchTotal(l), 0);

function short(n) {
  const a = Math.abs(n);
  const d = x => String(Number(x.toFixed(2)));
  return a >= 1e9 ? d(n / 1e9) + "B" : a >= 1e6 ? d(n / 1e6) + "M" : a >= 1e3 ? Math.round(n / 1e3) + "K" : String(Math.round(n));
}
const fmt = n => `${data.currency} ${short(n)}`;
const full = n => `${data.currency} ${Math.round(n).toLocaleString("en-US")}`;
const money = n => `<span class="cur">${esc(data.currency)}</span>${short(n)}`;
const pct = x => (x * 100).toFixed(1) + "%";
const delta = (cur, prev) => prev ? (cur - prev) / prev : null;
const deltaHTML = d => d == null ? `<span class="hint">first year</span>` : `<span class="${d >= 0 ? "up" : "down"}">${d >= 0 ? "↑" : "↓"} ${pct(Math.abs(d))}</span>`;
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}

/* ---------- shared pieces ---------- */
const legend = () => `<div class="chips" role="group" aria-label="Sections">${data.sections.map((s, i) =>
  `<button class="chip sec" type="button" data-act="sec" data-i="${i}" aria-pressed="${!state.off.has(i)}"><span class="dot" style="background:${color(i)}"></span>${esc(s)}</button>`).join("")}</div>`;
const yearChips = (act, sel) => `<div class="chips" role="group" aria-label="Year">${["all", ...years()].map(y =>
  `<button class="chip year" type="button" data-act="${act}" data-y="${y}" aria-pressed="${String(sel) === String(y)}">${y === "all" ? "All years" : y}</button>`).join("")}</div>`;

/* stacked column chart; cols = [{ key, label, parts: [[secIndex, value]] }] */
function columns(cols, { sel = null, H = 340, act = null } = {}) {
  const W = 720, m = { t: 28, r: 8, b: 32, l: 52 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const sums = cols.map(c => c.parts.reduce((t, p) => t + p[1], 0));
  const max = niceMax(Math.max(0, ...sums));
  const y = v => m.t + ih - (v / max) * ih;
  const band = iw / Math.max(cols.length, 1), bw = Math.min(58, band * 0.52);
  let g = "";
  [0, 0.5, 1].forEach(f => g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${m.l - 10}" y="${y(max * f) + 4}" text-anchor="end">${short(max * f)}</text>`);
  cols.forEach((c, k) => {
    const x = m.l + band * k + (band - bw) / 2;
    let acc = 0, segs = "";
    c.parts.forEach(([i, v]) => {
      if (!v) return;
      segs += `<rect class="seg" x="${x}" y="${y(acc + v)}" width="${bw}" height="${y(acc) - y(acc + v)}" fill="${color(i)}" style="animation-delay:${k * 70}ms"/>`;
      acc += v;
    });
    const tip = [`${c.label} · ${fmt(sums[k])}`, ...c.parts.filter(p => p[1]).map(([i, v]) => `${data.sections[i]}~${short(v)}`)].join("|");
    const cls = sel == null ? "" : String(sel) === String(c.key) ? " sel" : " dim";
    g += `<g class="col${cls}">${segs}<text class="tot" x="${x + bw / 2}" y="${y(acc) - 8}" text-anchor="middle">${acc ? short(acc) : ""}</text>
      <text class="yl" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(c.label)}</text>
      <rect class="hit" x="${m.l + band * k}" y="${m.t}" width="${band}" height="${ih + m.b}" data-tip="${esc(tip)}"${act ? ` data-act="${act}" data-y="${c.key}"` : ""}/></g>`;
  });
  return cols.length ? `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked column chart">${g}</svg>` : `<p class="empty">No data yet.</p>`;
}
const stackBar = parts => {
  const t = parts.reduce((a, p) => a + p[1], 0);
  return parts.filter(p => p[1]).map(([i, v], k) => `<span style="flex:${v / t};background:${color(i)};animation-delay:${k * 60}ms"></span>`).join("");
};

/* ---------- slides ---------- */
function cover() {
  const ys = years();
  return `<div class="inner cover">
    <div style="display:grid;gap:20px">
      <span class="eyebrow">Sales review · ${ys[0] ?? ""}–${ys[ys.length - 1] ?? ""}</span>
      <h1>Fragrance<br>Launch Sales</h1>
      <p class="lead">${data.launches.length} perfume launches, ${data.sections.length} sales sections, every year side by side.</p>
      <span class="pill${usingOwn ? " own" : ""}">${usingOwn ? "Your data, loaded in this browser" : "Sample figures · load your data on the last slide"}</span>
    </div>
    <div class="cover-foot">
      <div style="display:grid;gap:6px"><span class="eyebrow">Total sales, all years</span><span class="big">${money(grand())}</span></div>
      <span class="hint">Press <span class="kbd">→</span> or swipe to begin</span>
    </div></div>`;
}

function glance() {
  const ys = years(), last = ys[ys.length - 1], prev = ys[ys.length - 2];
  const cur = yearTotal(last), d = delta(cur, prev != null ? yearTotal(prev) : 0);
  const best = [...data.launches].sort((a, b) => launchTotal(b) - launchTotal(a))[0];
  const top = secs().map(i => [i, secTotal(i)]).sort((a, b) => b[1] - a[1])[0];
  const g = grand(), newest = data.launches.filter(l => l.launched === last);
  return `<div class="inner">
    <div class="head"><div><span class="eyebrow">At a glance</span><h2>The portfolio in four numbers</h2></div></div>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Total sales</span><span class="mid">${money(g)}</span><span class="note">${ys.length} years · ${full(g)}</span></div>
      <div class="stat"><span class="eyebrow">${last}</span><span class="mid">${money(cur)}</span><span class="note">${deltaHTML(d)} vs ${prev ?? "—"}</span></div>
      <div class="stat"><span class="eyebrow">Best launch</span><span class="mid">${best ? esc(best.name) : "—"}</span><span class="note">${best ? `${fmt(launchTotal(best))} · ${pct(launchTotal(best) / (g || 1))} of total` : ""}</span></div>
      <div class="stat"><span class="eyebrow">Top section</span><span class="mid">${top ? esc(data.sections[top[0]]) : "—"}</span><span class="note">${top ? `${pct(top[1] / (g || 1))} of sales · ${newest.length} new launch${newest.length === 1 ? "" : "es"} in ${last}` : ""}</span></div>
    </div></div>`;
}

function yearSlide() {
  const ys = years();
  if (state.ovYear == null || !ys.includes(Number(state.ovYear))) state.ovYear = ys[ys.length - 1];
  const sy = Number(state.ovYear), prev = ys[ys.indexOf(sy) - 1];
  const cur = yearTotal(sy), d = delta(cur, prev != null ? yearTotal(prev) : 0);
  const cols = ys.map(y => ({ key: y, label: String(y), parts: secs().map(i => [i, data.launches.reduce((t, l) => t + val(l, y, i), 0)]) }));
  const contrib = data.launches.map(l => [l, launchYear(l, sy)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  return `<div class="inner">
    <div class="head"><div><span class="eyebrow">Sales per year</span><h2>Growth year by year</h2></div>${legend()}</div>
    <div class="two">
      <div>${columns(cols, { sel: sy, act: "ovYear" })}<p class="hint" style="margin:8px 0 0">Click a year to see its breakdown.</p></div>
      <div class="panel">
        <div style="display:grid;gap:6px"><span class="eyebrow">${sy}</span><span class="big">${money(cur)}</span><span>${deltaHTML(d)} <span class="hint">vs ${prev ?? "previous year"}</span></span></div>
        <div class="kv">${contrib.map(([l, v]) => `<div><span>${esc(l.name)}${l.launched === sy ? ' <span class="pill" style="padding:0 8px">new</span>' : ""}</span><span class="num">${short(v)}</span></div>`).join("")}</div>
      </div>
    </div></div>`;
}

function sectionSlide() {
  const yf = inYear(state.splitYear);
  const rows = data.sections.map((s, i) => [i, secTotal(i, yf)]);
  const total = rows.filter(r => !state.off.has(r[0])).reduce((t, r) => t + r[1], 0);
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="inner">
    <div class="head"><div><span class="eyebrow">Sections</span><h2>Where the sales come from</h2></div>${yearChips("splitYear", state.splitYear)}</div>
    <div class="rows">${rows.sort((a, b) => b[1] - a[1]).map(([i, v]) => {
      const off = state.off.has(i);
      return `<div class="row${off ? " off" : ""}">
        <button class="chip sec" type="button" data-act="sec" data-i="${i}" aria-pressed="${!off}" style="justify-self:start"><span class="dot" style="background:${color(i)}"></span>${esc(data.sections[i])}</button>
        <div class="bar-h"><span style="width:${(v / max) * 100}%;background:${color(i)}"></span></div>
        <div class="val"><span class="share num">${off || !total ? "—" : pct(v / total)}</span><small class="num">${fmt(v)}</small></div></div>`;
    }).join("")}</div>
    <p class="hint" style="margin:0">Click a section to leave it out of every slide. Share is of the sections shown.</p></div>`;
}

function launchSlide(l, k) {
  const ys = years().filter(y => y >= l.launched);
  const tot = launchTotal(l), g = grand();
  const byYear = ys.map(y => [y, launchYear(l, y)]);
  const bestY = [...byYear].sort((a, b) => b[1] - a[1])[0];
  const last = byYear[byYear.length - 1], prev = byYear[byYear.length - 2];
  const top = secs().map(i => [i, launchSec(l, i)]).sort((a, b) => b[1] - a[1]);
  const cols = ys.map(y => ({ key: y, label: String(y), parts: secs().map(i => [i, val(l, y, i)]) }));
  return `<div class="inner">
    <div class="two rev">
      <div class="panel">
        <span class="eyebrow">Launch ${k + 1} of ${data.launches.length} · launched ${l.launched}</span>
        <h2 style="font-size:clamp(2.2rem,4.6vw,3.6rem);font-weight:300;letter-spacing:-0.03em">${esc(l.name)}</h2>
        <div style="display:grid;gap:6px"><span class="eyebrow">Sales to date</span><span class="big">${money(tot)}</span></div>
        <div class="kv">
          <div><span>Share of portfolio</span><span class="num">${pct(tot / (g || 1))}</span></div>
          <div><span>Best year</span><span class="num">${bestY ? `${bestY[0]} · ${short(bestY[1])}` : "—"}</span></div>
          <div><span>Latest year</span><span class="num">${last ? `${last[0]} · ${short(last[1])} ` : "—"}${last && prev ? deltaHTML(delta(last[1], prev[1])) : ""}</span></div>
          ${top.map(([i, v]) => `<div><span><span class="dot" style="background:${color(i)}"></span>${esc(data.sections[i])}</span><span class="num">${short(v)} · ${pct(v / (tot || 1))}</span></div>`).join("")}
        </div>
      </div>
      <div style="display:grid;gap:16px;min-width:0">${legend()}${columns(cols, { H: 360 })}</div>
    </div></div>`;
}

function rankSlide() {
  const yf = inYear(state.rankYear);
  const r = data.launches.map(l => ({ l, t: launchTotal(l, yf), parts: secs().map(i => [i, launchSec(l, i, yf)]) })).sort((a, b) => b.t - a.t);
  const max = Math.max(1, ...r.map(x => x.t)), tot = r.reduce((a, x) => a + x.t, 0);
  return `<div class="inner">
    <div class="head"><div><span class="eyebrow">Ranking</span><h2>Which launches sell most</h2></div>${yearChips("rankYear", state.rankYear)}</div>
    <div class="rows">${r.map((x, n) => `<div class="row">
      <div class="name"><span class="num hint">${n + 1}</span><span>${esc(x.l.name)} <small>· ${x.l.launched}</small></span></div>
      <div class="bar-h" style="width:${(x.t / max) * 100}%" data-tip="${esc([`${x.l.name} · ${fmt(x.t)}`, ...x.parts.filter(p => p[1]).map(([i, v]) => `${data.sections[i]}~${short(v)}`)].join("|"))}">${x.t ? stackBar(x.parts) : ""}</div>
      <div class="val"><span class="num">${x.t ? short(x.t) : "not on sale"}</span><small class="num">${x.t ? pct(x.t / (tot || 1)) : ""}</small></div></div>`).join("")}</div>
    ${legend()}</div>`;
}

function tableSlide() {
  const ys = years();
  const rows = data.launches.map(l => ({ l, by: ys.map(y => launchYear(l, y)), total: launchTotal(l) }));
  const g = rows.reduce((t, r) => t + r.total, 0);
  const { key, dir } = state.sort;
  const pick = r => key === "name" ? r.l.name : key === "launched" ? r.l.launched : key === "total" ? r.total : r.by[ys.indexOf(Number(key))];
  rows.sort((a, b) => (pick(a) > pick(b) ? 1 : pick(a) < pick(b) ? -1 : 0) * dir);
  const th = (k, label) => { const on = key === String(k); return `<th data-act="sort" data-k="${k}"${on ? ` aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""}>${label}${on ? (dir > 0 ? " ↑" : " ↓") : ""}</th>`; };
  let h = `<thead><tr>${th("name", "Perfume")}${th("launched", "Launched")}${ys.map(y => th(y, y)).join("")}${th("total", "Total")}<th>Share</th></tr></thead><tbody>`;
  rows.forEach(r => {
    const open = state.open.has(r.l.name);
    h += `<tr class="main${open ? " open" : ""}" data-act="row" data-name="${esc(r.l.name)}" tabindex="0" aria-expanded="${open}"><td><span class="caret">▸</span>${esc(r.l.name)}</td><td class="num">${r.l.launched}</td>
      ${r.by.map((v, k) => ys[k] < r.l.launched ? `<td class="num pre">–</td>` : `<td class="num">${short(v)}</td>`).join("")}<td class="num"><b style="font-weight:500">${short(r.total)}</b></td><td class="num">${pct(r.total / (g || 1))}</td></tr>`;
    if (open) secs().forEach(i => {
      const v = ys.map(y => val(r.l, y, i));
      h += `<tr class="detail"><td><span class="dot" style="background:${color(i)};margin-right:8px"></span>${esc(data.sections[i])}</td><td></td>${v.map((x, k) => `<td class="num">${ys[k] < r.l.launched ? "–" : short(x)}</td>`).join("")}<td class="num">${short(v.reduce((a, b) => a + b, 0))}</td><td></td></tr>`;
    });
  });
  h += `</tbody><tfoot><tr><td>All launches</td><td></td>${ys.map(y => `<td class="num">${short(yearTotal(y))}</td>`).join("")}<td class="num">${short(g)}</td><td class="num">100%</td></tr></tfoot>`;
  return `<div class="inner">
    <div class="head"><div><span class="eyebrow">All figures · ${esc(data.currency)}</span><h2>Launch by year</h2></div><span class="hint">Click a perfume for its sections · click a header to sort</span></div>
    <div class="table-wrap"><table>${h}</table></div></div>`;
}

function dataSlide() {
  if (state.draft == null) state.draft = toCSV(data);
  const st = state.status;
  return `<div class="inner">
    <div class="head"><div><span class="eyebrow">Your data</span><h2>Bring your own numbers</h2><p class="lead">Paste rows from Excel or a CSV, or upload a file. The whole deck rebuilds from them. Data stays in this browser.</p></div></div>
    <div class="two">
      <div style="display:grid;gap:12px;min-width:0">
        <label class="eyebrow" for="csvIn">Sales rows</label>
        <textarea id="csvIn" spellcheck="false">${esc(state.draft)}</textarea>
        <div class="btns">
          <button class="btn primary" type="button" data-act="apply">Apply data</button>
          <span class="btn file-btn">Upload .csv<input type="file" id="fileIn" accept=".csv,.txt,text/csv" aria-label="Upload CSV file"></span>
          <button class="btn" type="button" data-act="reset">Back to sample</button>
          <button class="btn" type="button" data-act="copy">Copy as CSV</button>
        </div>
        <span class="status ${st ? st.kind : ""}" role="status">${st ? esc(st.msg) : ""}</span>
      </div>
      <div class="panel">
        <span class="eyebrow">Format · one row per perfume, year and section</span>
        <pre class="format">perfume,launch_year,year,section,sales
Amber Nuit,2021,2021,Retail stores,420000
Amber Nuit,2021,2021,Duty free,185000
Amber Nuit,2021,2022,Retail stores,610000</pre>
        <label style="display:flex;gap:10px;align-items:center"><span class="eyebrow">Currency</span>
          <select id="curSel">${["AED", "USD", "SAR", "EUR", "GBP", "INR"].map(c => `<option${c === data.currency ? " selected" : ""}>${c}</option>`).join("")}</select></label>
        <p class="hint" style="margin:0">Sections and years are read from your rows, up to six sections. Sales can be revenue or units.</p>
      </div>
    </div></div>`;
}

const deck = () => [
  { title: "Cover", render: cover },
  { title: "At a glance", render: glance },
  { title: "Sales per year", render: yearSlide },
  { title: "Sections", render: sectionSlide },
  ...data.launches.map((l, k) => ({ title: l.name, render: () => launchSlide(l, k) })),
  { title: "Ranking", render: rankSlide },
  { title: "All figures", render: tableSlide },
  { title: "Your data", render: dataSlide }
];

/* ---------- render & navigation ---------- */
const track = $("track");
let list = [];
function render() {
  const scroll = [...track.children].map(s => s.scrollTop);
  list = deck();
  state.idx = Math.min(state.idx, list.length - 1);
  track.classList.add("instant");
  track.innerHTML = list.map((s, k) => `<section class="slide" aria-roledescription="slide" aria-label="${esc(s.title)}">${s.render()}</section>`).join("");
  [...track.children].forEach((s, k) => { s.scrollTop = scroll[k] || 0; });
  place();
  track.offsetWidth;
  track.classList.remove("instant");
}
function place() {
  track.style.transform = `translateX(${-state.idx * 100}%)`;
  [...track.children].forEach((s, k) => s.inert = k !== state.idx);
  $("prog").style.width = `${((state.idx + 1) / list.length) * 100}%`;
  $("count").textContent = `${String(state.idx + 1).padStart(2, "0")} / ${String(list.length).padStart(2, "0")}`;
  $("where").textContent = list[state.idx].title;
  $("prevBtn").disabled = state.idx === 0;
  $("nextBtn").disabled = state.idx === list.length - 1;
  $("menu").innerHTML = list.map((s, k) => `<button type="button" data-go="${k}" aria-current="${k === state.idx}"><span>${String(k + 1).padStart(2, "0")}</span>${esc(s.title)}</button>`).join("");
}
function go(i) {
  i = Math.max(0, Math.min(list.length - 1, i));
  if (i === state.idx) return;
  state.idx = i; place();
  const s = track.children[i];
  s.classList.remove("enter"); s.offsetWidth; s.classList.add("enter");
  setTimeout(() => s.classList.remove("enter"), 1400);
  try { localStorage.setItem(STORE_KEY + "-slide", i); } catch {}
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length) throw new Error("Paste at least one row of data.");
  const delim = lines[0].includes("\t") ? "\t" : lines[0].includes(";") && !lines[0].includes(",") ? ";" : ",";
  const split = line => { const out = []; let cur = "", q = false; for (const ch of line) { if (ch === '"') q = !q; else if (ch === delim && !q) { out.push(cur.trim()); cur = ""; } else cur += ch; } out.push(cur.trim()); return out; };
  let rows = lines.map(split);
  let idx = { perfume: 0, launch_year: 1, year: 2, section: 3, sales: 4 };
  const head = rows[0].map(h => h.toLowerCase().replace(/[^a-z]/g, ""));
  if (head.some(h => ["perfume", "year", "sales", "section"].includes(h))) {
    const find = (...n) => head.findIndex(h => n.includes(h));
    idx = { perfume: find("perfume", "fragrance", "product", "name"), launch_year: find("launchyear", "launched", "launch"), year: find("year", "salesyear"), section: find("section", "channel", "region"), sales: find("sales", "revenue", "amount", "value", "units") };
    rows = rows.slice(1);
    for (const [k, v] of Object.entries(idx)) if (v < 0 && k !== "launch_year") throw new Error(`Couldn't find a "${k}" column in the header row.`);
  }
  const sections = [], map = new Map();
  rows.forEach((r, n) => {
    const name = r[idx.perfume], yr = parseInt(r[idx.year], 10), sec = r[idx.section], ly = parseInt(r[idx.launch_year], 10);
    const sales = parseFloat(String(r[idx.sales] ?? "").replace(/[^0-9.\-]/g, ""));
    if (!name || !sec || isNaN(yr) || isNaN(sales)) throw new Error(`Row ${n + 1} is incomplete: "${r.join(delim)}"`);
    if (!sections.includes(sec)) sections.push(sec);
    if (!map.has(name)) map.set(name, { name, launched: ly || yr, sales: {} });
    const l = map.get(name);
    if (!ly) l.launched = Math.min(l.launched, yr);
    const si = sections.indexOf(sec);
    (l.sales[yr] ||= [])[si] = (l.sales[yr][si] || 0) + sales;
  });
  if (sections.length > 6) throw new Error(`Found ${sections.length} sections; the deck shows up to 6. Merge some and try again.`);
  const launches = [...map.values()];
  launches.forEach(l => Object.values(l.sales).forEach(a => { for (let i = 0; i < sections.length; i++) a[i] = a[i] || 0; }));
  return { currency: data.currency, sections, launches: launches.sort((a, b) => a.launched - b.launched || a.name.localeCompare(b.name)) };
}
function toCSV(d) {
  const out = ["perfume,launch_year,year,section,sales"];
  d.launches.forEach(l => Object.keys(l.sales).sort().forEach(y => d.sections.forEach((s, i) =>
    out.push([l.name, l.launched, y, s, l.sales[y][i] || 0].map(v => /[,"]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v).join(",")))));
  return out.join("\n");
}
function resetView() { state.off.clear(); state.open.clear(); state.ovYear = null; state.splitYear = "all"; state.rankYear = "all"; }
function applyText(text) {
  try {
    data = parseCSV(text); usingOwn = true; save(data); resetView();
    state.status = { msg: `Loaded ${data.launches.length} launches across ${data.sections.length} sections.`, kind: "ok" };
  } catch (e) { state.status = { msg: e.message, kind: "err" }; }
  render();
}

/* ---------- events ---------- */
track.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "sec") { const i = +a.dataset.i; state.off.has(i) ? state.off.delete(i) : state.off.add(i); if (state.off.size === data.sections.length) state.off.delete(i); }
  else if (act === "ovYear") state.ovYear = a.dataset.y;
  else if (act === "splitYear") state.splitYear = a.dataset.y;
  else if (act === "rankYear") state.rankYear = a.dataset.y;
  else if (act === "sort") { const k = a.dataset.k; state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (k === "name" || k === "launched" ? 1 : -1) }; }
  else if (act === "row") { const n = a.dataset.name; state.open.has(n) ? state.open.delete(n) : state.open.add(n); }
  else if (act === "apply") return applyText(state.draft);
  else if (act === "reset") { data = SAMPLE; usingOwn = false; save(null); resetView(); state.draft = toCSV(data); state.status = { msg: "Showing sample figures.", kind: "" }; }
  else if (act === "copy") {
    const csv = toCSV(data);
    const fallback = () => { state.draft = csv; state.status = { msg: "Copy is blocked here. The CSV is in the box; select it and copy.", kind: "" }; render(); };
    if (navigator.clipboard) navigator.clipboard.writeText(csv).then(() => { state.status = { msg: "Copied current data as CSV.", kind: "ok" }; render(); }, fallback); else fallback();
    return;
  }
  tip.hidden = true;
  render();
});
track.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.main")) { e.preventDefault(); e.target.click(); } });
track.addEventListener("input", e => { if (e.target.id === "csvIn") state.draft = e.target.value; });
track.addEventListener("change", e => {
  if (e.target.id === "curSel") { data = { ...data, currency: e.target.value }; if (usingOwn) save(data); else SAMPLE.currency = e.target.value; render(); }
  if (e.target.id === "fileIn") {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { state.draft = rd.result; applyText(rd.result); };
    rd.readAsText(f);
  }
});

$("prevBtn").addEventListener("click", () => go(state.idx - 1));
$("nextBtn").addEventListener("click", () => go(state.idx + 1));
const menu = $("menu");
$("menuBtn").addEventListener("click", () => { menu.hidden = !menu.hidden; $("menuBtn").setAttribute("aria-expanded", !menu.hidden); });
menu.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (!b) return; go(+b.dataset.go); menu.hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); });
document.addEventListener("click", e => { if (!menu.hidden && !e.target.closest(".ctrl")) { menu.hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); } });

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && !e.target.closest("button, tr"))) { e.preventDefault(); go(state.idx + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(state.idx - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(list.length - 1);
  else if (e.key === "Escape") menu.hidden = true;
});
let touch = null;
$("deck").addEventListener("touchstart", e => { touch = e.target.closest(".table-wrap, textarea") ? null : [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
$("deck").addEventListener("touchend", e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch[0], dy = e.changedTouches[0].clientY - touch[1];
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(state.idx + (dx < 0 ? 1 : -1));
  touch = null;
}, { passive: true });

/* tooltip: "Header|Label~value|..." */
const tip = $("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  const [head, ...rest] = t.dataset.tip.split("|");
  tip.innerHTML = `<b>${esc(head)}</b>` + rest.map(r => { const [a, b] = r.split("~"); return `<div><span>${esc(a)}</span><span class="num">${esc(b)}</span></div>`; }).join("");
  tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px";
});

render();
try { const s = +localStorage.getItem(STORE_KEY + "-slide"); if (s > 0) { state.idx = Math.min(s, list.length - 1); place(); } } catch {}
</script>
